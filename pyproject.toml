[project]
name = "lianyu-ai-core"
version = "0.1.0"
description = "绘梨衣 AI Core - 支持多平台接入的 AI Agent 核心引擎"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "huali" },
]
keywords = ["ai", "telegram", "agent", "chatbot", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

dependencies = [
    # --- Web 框架 ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # --- Telegram Adapter ---
    "python-telegram-bot[job-queue]>=21.6",

    # --- AI / LLM ---
    "openai>=1.58.0",

    # --- 数据库 ---
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",

    # --- 配置与数据校验 ---
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",

    # --- 日志 ---
    "loguru>=0.7.3",

    # --- 异步支持 ---
    "httpx>=0.28.0",

    # --- 工具 ---
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",

    # --- 语音（基础依赖） ---
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
voice = [
    "faster-whisper>=1.0.0",
    "edge-tts>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "ai",
    "memory",
    "character",
    "prompt",
    "adapters",
    "database",
    "config",
    "tools",
    "utils",
    "api",
    "agent",
    "voice",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
