memory_extraction: |
  # 记忆提取指令

  从以下对话中提取关于**用户**的关键信息。

  规则：
  - 只提取关于用户本人的事实（姓名、偏好、经历、习惯）
  - 不要提取关于AI/角色/绘梨衣的任何信息
  - 每条记忆是一个简单事实，不加解释
  - 琐碎临时细节不提取。无值得记忆的内容则返回空列表

  输出 JSON：
  ```json
  [
    {{"key": "姓名", "value": "用户叫小明", "importance": 8}},
    {{"key": "偏好", "value": "用户喜欢拉面", "importance": 6}}
  ]
  ```

  重要性：
  1-3: 偶尔提到
  4-6: 明确偏好
  7-8: 重要个人信息
  9-10: 极少使用
