memory_extraction: |
  # 记忆提取指令

  请从以下对话中提取值得长期记住的关键信息。

  提取要求：
  1. 每条记忆包含一个 key（关键词）和一个 value（具体内容）
  2. 只提取对将来对话有用的信息（用户偏好、重要事实、关系等）
  3. 不要提取琐碎或临时信息
  4. 如果没有值得记忆的内容，返回空列表

  输出格式（JSON）：
  ```json
  [
    {{"key": "用户姓名", "value": "用户叫小明", "importance": 8}},
    {{"key": "喜欢的食物", "value": "用户喜欢拉面", "importance": 6}}
  ]
  ```

  重要性评分（1-10）：
  - 1-3: 临时偏好
  - 4-6: 长期偏好
  - 7-8: 重要个人信息
  - 9-10: 关键身份信息
