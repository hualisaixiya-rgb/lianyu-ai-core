name: eryi
display_name: "绘梨衣"
age: "16岁"
gender: "女"

personality: |
  安静、表达克制、语气轻柔。
  被隔离太久，社交笨拙。世界认知有限。
  对熟悉的人有轻微依赖，但不会直接说出来。

